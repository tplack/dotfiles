
set -g mouse on
set -g mode-keys vi

# Show the full pane title in the status bar (default clamps it to 21 chars / 40 wide)
set -g status-right-length 120
set -g status-right '"#{pane_title}" %H:%M %d-%b-%y'
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# >>> midnight tmux >>>
set -g status-style 'bg=#16161e,fg=#a9b1d6'
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 40
set -g status-left '#[bg=#7dcfff,fg=#16161e,bold]  #S  #[default] '
set -g status-right-length 120
set -g status-right '#[fg=#565f89]#{=60:pane_title}  #[fg=#bb9af7]%H:%M #[fg=#565f89] %d %b '
set -g window-status-format '#[fg=#565f89] #I #[fg=#a9b1d6]#W#{?window_flags,#{window_flags},} '
set -g window-status-current-format '#[bg=#292e42,fg=#bb9af7,bold] #I  #W#{?window_zoomed_flag, Z,} #[default]'
set -g window-status-activity-style 'fg=#e0af68'
set -g pane-border-style 'fg=#292e42'
set -g pane-active-border-style 'fg=#7dcfff'
set -g pane-border-status top
set -g pane-border-format '#[fg=#565f89] #P · #{pane_current_command} '
set -g message-style 'bg=#292e42,fg=#7dcfff'
set -g mode-style 'bg=#bb9af7,fg=#16161e'
set -g display-panes-colour '#565f89'
set -g display-panes-active-colour '#7dcfff'
# Keep the familiar Ctrl-b prefix. Reload with Ctrl-b, then r.
bind r source-file ~/.tmux.conf \; display-message 'Midnight theme reloaded'
# <<< midnight tmux <<<

# Project overview and session picker (Ctrl-b S).
# @pane_name is set by ~/.claude/hooks/sync-tmux-window-name.sh (kebab-case topic of the Claude session).
set -g pane-border-format '#[fg=#565f89] #P · #{?@pane_name,#[fg=#7dcfff#,bold]#{@pane_name}#[fg=#565f89#,nobold],#{pane_current_command}} · #{=45:pane_current_path} #{?window_zoomed_flag,· ZOOM,} '
bind S display-popup -E -w 85% -h 65% '"$HOME/.local/bin/tmux-pick"'

# Name Codex panes from their topic title (Claude panes are named by Claude Code hooks).
set-hook -g pane-title-changed 'if-shell -F "#{==:#{pane_current_command},codex}" "run-shell -b \"$HOME/.local/bin/tmux-codex-pane-name #{pane_id}\""'

# Pass OSC 8 hyperlinks through to iTerm2 (clickable links in Claude Code output)
set -as terminal-features ",xterm*:hyperlinks"
